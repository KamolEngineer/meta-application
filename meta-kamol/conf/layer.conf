# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-kamol"
BBFILE_PATTERN_meta-kamol = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kamol = "6"

LAYERDEPENDS_meta-kamol = "core"
LAYERSERIES_COMPAT_meta-kamol = "scarthgap"
